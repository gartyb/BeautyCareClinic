# Phase 013 (RC-4): captures the Postgres container's actual running configuration in the
# repo so the loopback-only port binding survives a container recreation. Previously this
# container was started with an ad hoc `docker run` and its config existed only on the
# server (un-versioned). Credentials come from a local, gitignored `.env` file — see
# `.env.docker.example` for the required keys. Do not commit real credentials here.
#
# The named volume is `external: true` because it already holds the production data
# (created by the original `docker run`) — this file must never create a fresh volume.
services:
  postgres:
    # Verified against the live container's actual image at recreation time via:
    #   docker inspect --format '{{.Config.Image}}' beautycare-postgres
    image: postgres:17
    container_name: beautycare-postgres
    restart: unless-stopped
    ports:
      # Loopback-only: the backend connects via "localhost", and Postgres must not be
      # reachable from the public internet (Phase 013 finding — Docker's own iptables
      # rules for published ports bypass ufw's default-deny).
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required — copy .env.docker.example to .env and fill it in}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.docker.example to .env and fill it in}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required — copy .env.docker.example to .env and fill it in}
    volumes:
      - beautycare-postgres-data:/var/lib/postgresql/data

volumes:
  beautycare-postgres-data:
    external: true
